<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Secure File Download</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-image: url('logo.jpg');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { margin-top: 0; color: #1a1a1a; }
        p { color: #555; margin-bottom: 25px; }
        input { 
            width: 85%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #ccd0d5; 
            border-radius: 6px; 
            font-size: 15px;
        }
        button { 
            padding: 12px 25px; 
            background-color: #1877f2; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #166fe5; }
        #result { margin-top: 25px; }
        .download-btn { 
            display: inline-block; 
            margin-top: 15px; 
            padding: 12px 25px; 
            background-color: #42b72a; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold;
            transition: 0.2s;
        }
        .download-btn:hover { background-color: #36a420; }
        .error { color: #fa3e3e; font-weight: bold; }
    </style>
</head>
<body>


    <div class="card">
        <h2>Find Certificate of Appearance</h2>
        <p>Enter your registered email address to download your CA.</p>
        
        <input type="email" id="emailInput" placeholder="Enter email address" required>
        <br>
        <button id="searchBtn">Search</button>
        
        <div id="result"></div>
    </div>

    <script>
        document.getElementById("searchBtn").addEventListener("click", performSearch);
        document.getElementById("emailInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") performSearch();
        });

        async function performSearch() {
            const email = document.getElementById('emailInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!email) {
                resultDiv.innerHTML = '<span class="error">Please enter an email address.</span>';
                return;
            }

            resultDiv.innerHTML = '<span style="color: #666;">Searching...</span>';

            try {
                const response = await fetch(`/api/search?email=${encodeURIComponent(email)}`);
                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div style="color: #333; font-weight: bold;">File found: ${data.fileName}</div>
                        <a href="${data.downloadUrl}" class="download-btn" download>Download File</a>
                    `;
                } else {
                    resultDiv.innerHTML = `<span class="error">${data.message}</span>`;
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="error">Could not connect to the server.</span>';
            }
        }
    </script>
</body>
</html>
